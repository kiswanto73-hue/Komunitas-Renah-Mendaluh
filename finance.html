<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINDARA FINANCE | KHUSUS BENDAHARA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-4xl mx-auto flex justify-between items-center mb-10">
        <h1 class="font-black text-2xl italic">SINDARA<span class="text-emerald-500">FINANCE</span></h1>
        <button onclick="location.href='index.html'" class="text-xs font-bold opacity-50 hover:opacity-100"> Kembali ke Beranda</button>
    </div>

    <div id="loginFinance" class="max-w-md mx-auto mt-20">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl text-slate-900 text-center">
            <i class="fas fa-wallet text-4xl text-indigo-600 mb-4"></i>
            <h2 class="text-xl font-black uppercase mb-6">Akses Bendahara</h2>
            <input type="text" id="passFinance" placeholder="MASUKKAN KODE AKSES" class="w-full p-4 bg-slate-100 rounded-2xl mb-4 text-center font-black outline-none border-2 border-transparent focus:border-indigo-600 uppercase">
            <button onclick="authFinance()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase shadow-lg">Buka Laporan Kas</button>
        </div>
    </div>

    <div id="dashboardFinance" class="hidden max-w-4xl mx-auto space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-emerald-600 p-8 rounded-[2.5rem] shadow-xl">
                <p class="text-[10px] font-black opacity-80 uppercase tracking-widest">Total Saldo Kas</p>
                <h3 id="saldoTotal" class="text-3xl font-black italic">Rp 0</h3>
            </div>
            <div class="bg-white/10 p-8 rounded-[2.5rem] border border-white/10">
                <p class="text-[10px] font-black text-emerald-400 uppercase">Total Masuk</p>
                <h3 id="totalMasuk" class="text-xl font-bold">Rp 0</h3>
            </div>
            <div class="bg-white/10 p-8 rounded-[2.5rem] border border-white/10">
                <p class="text-[10px] font-black text-rose-400 uppercase">Total Keluar</p>
                <h3 id="totalKeluar" class="text-xl font-bold">Rp 0</h3>
            </div>
        </div>

        <div class="bg-white p-10 rounded-[3rem] text-slate-900 shadow-2xl">
            <h3 class="text-xl font-black uppercase italic mb-8 border-b pb-4">Input Transaksi Baru</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-2">JENIS TRANSAKSI</label>
                    <select id="kasTipe" class="w-full p-4 bg-slate-100 rounded-xl font-bold outline-none">
                        <option value="masuk">Pemasukan (+)</option>
                        <option value="keluar">Pengeluaran (-)</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-2">NOMINAL (RP)</label>
                    <input type="number" id="kasNominal" placeholder="Contoh: 50000" class="w-full p-4 bg-slate-100 rounded-xl font-bold outline-none">
                </div>
                <div class="space-y-1 md:col-span-2">
                    <label class="text-[10px] font-black text-slate-400 ml-2">KETERANGAN</label>
                    <input type="text" id="kasKet" placeholder="Kegiatan apa atau dari siapa?" class="w-full p-4 bg-slate-100 rounded-xl font-bold outline-none">
                </div>
                <div class="space-y-1 md:col-span-2">
                    <label class="text-[10px] font-black text-slate-400 ml-2">LINK BUKTI FISIK (DRIVE / FOTO)</label>
                    <input type="text" id="kasBukti" placeholder="https://drive.google.com/..." class="w-full p-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl font-bold outline-none text-indigo-600">
                </div>
                <button onclick="simpanTransaksi()" class="md:col-span-2 bg-indigo-600 text-white p-5 rounded-2xl font-black uppercase shadow-lg mt-4 hover:bg-indigo-700">Simpan Transaksi</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCUjE8WXa8Py4vnojrXDUR3uCvnQEzP6zQ",
            databaseURL: "https://e-kantin-91f0c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "e-kantin-91f0c",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentId = null;

        function authFinance() {
            const key = document.getElementById('passFinance').value.toUpperCase();
            // Daftar kode yang diizinkan akses finance
            const authorized = ["INTI-SINDARA", "G1-BAWAH", "G1-ATAS", "G2-BAWAH", "G2-ATAS", "PJOK", "PAI"];
            
            if (authorized.includes(key)) {
                currentId = key;
                document.getElementById('loginFinance').classList.add('hidden');
                document.getElementById('dashboardFinance').classList.remove('hidden');
                muatDataFinance();
            } else {
                alert("KODE AKSES BENDAHARA TIDAK VALID!");
            }
        }

        function simpanTransaksi() {
            const nominal = parseInt(document.getElementById('kasNominal').value);
            const ket = document.getElementById('kasKet').value;
            const tipe = document.getElementById('kasTipe').value;
            const bukti = document.getElementById('kasBukti').value;

            if(!nominal || !ket) return alert("Mohon lengkapi nominal dan keterangan!");

            db.ref(`sindara_kas/${currentId}`).push({
                tipe: tipe,
                nominal: nominal,
                keterangan: ket,
                bukti: bukti || "-",
                tgl: new Date().toLocaleDateString('id-ID'),
                timestamp: Date.now()
            }).then(() => {
                alert("Transaksi Berhasil Dicatat!");
                document.getElementById('kasNominal').value = "";
                document.getElementById('kasKet').value = "";
                document.getElementById('kasBukti').value = "";
            });
        }

        function muatDataFinance() {
            db.ref(`sindara_kas/${currentId}`).on('value', s => {
                let masuk = 0, keluar = 0;
                s.forEach(tx => {
                    const t = tx.val();
                    if(t.tipe === 'masuk') masuk += t.nominal;
                    else keluar += t.nominal;
                });
                document.getElementById('totalMasuk').innerText = "Rp " + masuk.toLocaleString('id-ID');
                document.getElementById('totalKeluar').innerText = "Rp " + keluar.toLocaleString('id-ID');
                document.getElementById('saldoTotal').innerText = "Rp " + (masuk - keluar).toLocaleString('id-ID');
            });
        }
    </script>
</body>
</html>
